<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="content-language" content="en" />
  <title>Reset Password — Concordia Recreation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c-bg:        #FFFFFF;
      --c-surface:   #F7F3F4;
      --c-card:      #FFFFFF;
      --c-primary:   #912338;
      --c-primary-l: #B82B45;
      --c-text:      #1A0A0E;
      --c-muted:     #6B5A5E;
      --c-border:    rgba(145, 35, 56, 0.18);
      --c-input-border: rgba(0,0,0,0.15);
      --f-display:   'Barlow Condensed', sans-serif;
      --f-body:      'Inter', sans-serif;
      --radius: 12px;
      --transition: 200ms ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--c-surface); color: var(--c-text); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }

    /* NAV */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 0 40px; height: 64px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(145,35,56,0.12); box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }
    .logo-mark { height: 40px; width: auto; display: block; }
    .nav__links { display: flex; align-items: center; gap: 4px; list-style: none; justify-content: center; }
    .nav__links a { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--c-muted); transition: color var(--transition), background var(--transition); }
    .nav__links a:hover { color: var(--c-text); background: rgba(145,35,56,0.07); }
    .nav__links .lang-sep { color: var(--c-border); font-size: 11px; padding: 0 2px; }
    .nav__actions { display: flex; align-items: center; gap: 8px; margin-right: 10px; justify-content: flex-end; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 8px; font-family: var(--f-body); font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition); border: none; }
    .btn--ghost { background: transparent; color: var(--c-text); border: 1px solid rgba(0,0,0,0.15); }
    .btn--ghost:hover { background: rgba(0,0,0,0.04); }
    .btn--primary { background: var(--c-primary); color: #fff; }
    .btn--primary:hover { background: var(--c-primary-l); transform: translateY(-1px); }

    /* Hamburger */
    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 22px; height: 32px; background: transparent; border: none; cursor: pointer; padding: 4px 0; margin-left: 6px; }
    .hamburger:hover { opacity: 0.7; }
    .hamburger span { display: block; height: 2px; background: var(--c-text); border-radius: 2px; transition: all 250ms ease; transform-origin: center; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; }

    /* PAGE */
    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 20px 60px; }

    .form-card {
      width: 100%; max-width: 420px;
      background: var(--c-card); border: 1px solid var(--c-border);
      border-radius: var(--radius); padding: 40px;
    }

    .form-card__title {
      font-family: var(--f-display); font-weight: 900;
      font-size: 48px; text-transform: uppercase;
      color: var(--c-text); line-height: 1; margin-bottom: 28px;
    }
    .form-card__title em { font-style: normal; color: var(--c-primary); }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--c-muted); }

    input[type="email"] {
      width: 100%; padding: 11px 14px;
      font-family: var(--f-body); font-size: 14px; color: var(--c-text);
      background: var(--c-bg); border: 1px solid var(--c-input-border);
      border-radius: 8px; outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus { border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(145,35,56,0.1); }
    input::placeholder { color: rgba(107,90,94,0.45); }

    .btn--submit {
      width: 100%; background: var(--c-primary); color: #fff; border: none;
      padding: 12px; border-radius: 8px;
      font-family: var(--f-display); font-size: 18px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
      transition: all var(--transition); margin-top: 8px;
    }
    .btn--submit:hover { background: var(--c-primary-l); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(145,35,56,0.25); }

    .form-hint { font-size: 13px; color: var(--c-muted); margin-top: 12px; }

    .form-footer { margin-top: 20px; text-align: center; font-size: 13px; color: var(--c-muted); }
    .form-footer a { color: var(--c-primary); text-decoration: underline; }

    @media (max-width: 768px) {
      .nav { padding: 0 16px; display: flex; justify-content: space-between; }
      .nav__links { display: none; }
      .hamburger { display: flex; }
      .form-card { padding: 28px 20px; }

      .mobile-menu { display: block; position: fixed; inset: 0; z-index: 99; pointer-events: none; }
      .mobile-menu.open { pointer-events: all; }
      .mobile-menu__overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 300ms ease; }
      .mobile-menu.open .mobile-menu__overlay { background: rgba(0,0,0,0.3); }
      .mobile-menu__panel { position: absolute; top: 0; right: 0; width: 280px; height: 100%; background: #fff; padding: 80px 24px 40px; display: flex; flex-direction: column; gap: 32px; transform: translateX(100%); transition: transform 300ms ease; box-shadow: -8px 0 32px rgba(0,0,0,0.1); }
      .mobile-menu.open .mobile-menu__panel { transform: translateX(0); }
      .mobile-menu__panel ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }
      .mobile-menu__panel ul a { display: block; padding: 12px 16px; font-size: 15px; font-weight: 500; color: var(--c-text); border-radius: 8px; transition: all var(--transition); }
      .mobile-menu__panel ul a:hover { background: rgba(145,35,56,0.07); color: var(--c-primary); }
    }
  </style>
  <meta name="robots" content="noindex, nofollow" />
  <script src="/demos/demo-guard.js" defer></script>
</head>
<body>

  <nav class="nav">
    <a href="index.html" aria-label="Concordia Recreation Home">
      <img class="logo-mark" src="logo.png" alt="Concordia Recreation" />
    </a>
    <ul class="nav__links">
      <li><a href="index.html">Welcome <span class="lang-sep">/</span> Bienvenue</a></li>
      <li><a href="schedule.html">Schedule <span class="lang-sep">/</span> Horaire</a></li>
      <li><a href="standings.html">Standings <span class="lang-sep">/</span> Classement</a></li>
    </ul>
    <div class="nav__actions">
      <button class="btn btn--ghost" onclick="window.location.href='signin.html'">Sign In</button>
      <button class="btn btn--primary" onclick="window.location.href='create-account.html'">Create Account</button>
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu__overlay" id="menuOverlay"></div>
    <div class="mobile-menu__panel">
      <ul>
        <li><a href="index.html">Welcome / Bienvenue</a></li>
        <li><a href="schedule.html">Schedule / Horaire</a></li>
        <li><a href="standings.html">Standings / Classement</a></li>
      </ul>
    </div>
  </div>

  <main class="page">
    <div class="form-card">
      <h1 class="form-card__title">Reset <em>Password</em></h1>

      <form action="#" method="post" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <button type="submit" class="btn--submit">Reset Password</button>
        <p class="form-hint">We will send a reset password link to your email address.</p>
      </form>

      <div class="form-footer" style="margin-top:20px;">
        <a href="signin.html">← Back to Sign In</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const btn = document.getElementById('hamburger');
      const menu = document.getElementById('mobileMenu');
      const overlay = document.getElementById('menuOverlay');
      function toggle() {
        const open = menu.classList.toggle('open');
        btn.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open);
        menu.setAttribute('aria-hidden', !open);
        document.body.style.overflow = open ? 'hidden' : '';
      }
      btn.addEventListener('click', toggle);
      overlay.addEventListener('click', toggle);
    })();
  </script>

</body>
</html>
